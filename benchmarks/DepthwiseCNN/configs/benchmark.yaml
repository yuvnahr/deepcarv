# =============================================================================
# benchmarks/DepthwiseCNN/configs/benchmark.yaml
# =============================================================================
# Single source of truth for the DepthwiseCNN FFT-75 benchmark run.
#
# Fragment-size switch
# --------------------
# Change dataset.fragment_size to 512 or 4096 — that is the ONLY edit
# required to run the complementary benchmark scenario.  All downstream
# scripts and the notebook read this value and propagate it automatically.
#
# Variant switch
# --------------
# Change model.kwargs.variant to one of: dsc | dsc-se | m-dsc
# =============================================================================

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  # Path to the FFT-75 root that contains 512/ and 4096/ subdirectories.
  # Locally:  data/FFT-75
  # Kaggle:   /kaggle/working/data/FFT-75  (set via DEEPCARV_DATA_ROOT env var)
  root_dir: "data/FFT-75"

  # Fragment size in bytes. Switch between 512 and 4096 here only.
  fragment_size: 4096      # <- CHANGE THIS to 512 for the 512-byte scenario

  # Load all splits into RAM on startup (recommended; FFT-75 fits in memory).
  cache: true

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  # Registry key — must match the entry in src/models/registry.py.
  name: "depthwisecnn"

  # Keyword arguments forwarded to build_depthwisecnn_adapter().
  kwargs:
    # Architecture variant: dsc | dsc-se | m-dsc
    variant: "dsc"         # <- CHANGE THIS to select a different variant
    # Dropout probability for the M-DSC head classifier (ignored by dsc/dsc-se).
    dropout_p: 0.2

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
# All keys are consumed by TrainerConfig.from_dict() in src/training/trainer.py.
# Do not add unknown keys — they are silently ignored by from_dict().
training:
  seed: 42
  epochs: 30
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: "adam"          # adam | adamw | sgd
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 2
  grad_clip: 1.0
  patience: 5                # early-stopping patience (epochs without improvement)
  monitor: "val_acc"
  monitor_mode: "max"
  amp: true                  # mixed-precision (auto-disabled on CPU)
  device: "auto"             # "cuda" | "cpu" | "auto"  (auto picks cuda if available)

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  # Dataset split to run the full evaluator on after training.
  split: "test"
  # Batch size for inference (can be larger than training batch).
  batch_size: 512

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
# All paths are relative to the repository root.
# The train / evaluate scripts resolve them against the CWD (repo root).
# Kaggle paths are resolved automatically via DEEPCARV_DATA_ROOT /
# DEEPCARV_OUTPUTS_DIR env vars set in the notebook preamble.
paths:
  # Directory that receives training outputs (curves, checkpoints).
  run_outputs: "outputs/DepthwiseCNN"
  # Best checkpoint saved by the trainer.
  best_checkpoint: "outputs/DepthwiseCNN/checkpoint_best.pt"
  # Last checkpoint saved by the trainer (useful for resume).
  last_checkpoint: "outputs/DepthwiseCNN/checkpoint_last.pt"
  # Directory that receives evaluator outputs (metrics.json, confusion_matrix.csv, …).
  eval_outputs: "outputs/DepthwiseCNN/eval"
