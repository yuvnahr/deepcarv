# configs/datasets/fft75_512.yaml
# ---------------------------------
# FFT-75 benchmark dataset, 512-byte fragment size.
#
# Layout on disk:
#   {root_dir}/512/train.npz
#   {root_dir}/512/val.npz
#   {root_dir}/512/test.npz
#
# Keys in each NPZ:  x (byte values), y (integer class labels)
# Classes: 75 file types (Scenario #1)
#
# root_dir is resolved relative to REPO_ROOT when not absolute.
# Override via DEEPCARV_DATA_ROOT environment variable.

name: fft75_512
root_dir: data/FFT-75
fragment_size: 512
version: "1.0"
num_classes: 75
