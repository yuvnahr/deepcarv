# ============================================================
# configs/fft75_s1_512_bytercnn.yaml
# Frozen canonical configuration for the ByteRCNN baseline
# on FFT-75 Scenario #1 (512-byte fragments, 75 classes).
#
# DO NOT change benchmark settings (marked FROZEN).
# Training hyperparameters may be tuned, but the split, seed,
# fragment size, and class count must remain fixed.
# ============================================================

# ---- Benchmark identity (FROZEN) --------------------------------
benchmark:
  name: "FFT-75 Scenario #1"
  dataset: "FFT-75"
  scenario: 1                   # FROZEN — all 75 file types
  fragment_length: 512          # FROZEN — 512 bytes per fragment
  num_classes: 75               # FROZEN
  split_ratio:
    train: 0.80                 # FROZEN
    val:   0.10                 # FROZEN
    test:  0.10                 # FROZEN
  seed: 42                      # FROZEN — never change

# ---- Google Drive source (fill in your file/folder ID) ----------
drive:
  file_id: "YOUR_GDRIVE_FILE_ID"   # <-- replace with your actual ID
  archive_name: "FFT-75.zip"       # name of the downloaded archive
  # If a folder ID, use: gdown --folder <file_id>
  # If a file ID, use:   gdown <file_id> -O <archive_name>

# ---- Local / Kaggle paths ---------------------------------------
# These are relative to the repository root.
# The Kaggle notebook overrides these via KAGGLE_RUNTIME=1 env var.
paths:
  data_root:      "data"
  raw_dir:        "data/raw"
  splits_dir:     "data/splits"
  fft75_splits:   "data/splits/fft75_s1_512"
  train_csv:      "data/splits/fft75_s1_512/train.csv"
  val_csv:        "data/splits/fft75_s1_512/val.csv"
  test_csv:       "data/splits/fft75_s1_512/test.csv"
  class_map:      "data/splits/fft75_s1_512/class_map.json"
  manifest:       "data/splits/fft75_s1_512/manifest.json"
  best_checkpoint:  "checkpoints/best_bytercnn_fft75.pt"
  sanity_checkpoint: "checkpoints/sanity_bytercnn_fft75.pt"
  run_outputs:    "outputs/bytercnn_fft75"
  logs_dir:       "logs"

# Kaggle-specific path overrides (used when KAGGLE_RUNTIME=1)
kaggle_paths:
  data_root:      "/kaggle/working/data"
  raw_dir:        "/kaggle/working/data/raw"
  splits_dir:     "/kaggle/working/data/splits"
  fft75_splits:   "/kaggle/working/data/splits/fft75_s1_512"
  train_csv:      "/kaggle/working/data/splits/fft75_s1_512/train.csv"
  val_csv:        "/kaggle/working/data/splits/fft75_s1_512/val.csv"
  test_csv:       "/kaggle/working/data/splits/fft75_s1_512/test.csv"
  class_map:      "/kaggle/working/data/splits/fft75_s1_512/class_map.json"
  best_checkpoint: "/kaggle/working/checkpoints/best_bytercnn_fft75.pt"
  run_outputs:    "/kaggle/working/outputs/bytercnn_fft75"
  logs_dir:       "/kaggle/working/logs"

# ---- Model hyperparameters (FROZEN for benchmark) ---------------
model:
  name: "ByteRCNN"
  # Architecture — FROZEN per published paper
  embedding_dim: 16             # FROZEN
  gru_units: 64                 # FROZEN
  gru_layers: 2                 # FROZEN — stacked bidirectional
  kernel_sizes: [9, 27, 40, 65] # FROZEN — 4 parallel CNN branches
  cnn_filters: 64               # FROZEN — filters per branch
  dense_units: [1024, 512]      # FROZEN — two dense layers
  dropout: 0.5

# ---- Training hyperparameters -----------------------------------
training:
  seed: 42
  epochs: 30
  batch_size: 256
  lr: 0.001                     # Adam/AdamW learning rate
  weight_decay: 0.0001
  patience: 5                   # early stopping patience (val_acc)
  grad_clip: 1.0                # gradient norm clipping
  cache_dataset: false          # set true if RAM allows (~25 GB for full FFT-75)
  num_workers: null             # null = auto-detect (min(4, cpu_count//2))
  optimizer: "adamw"
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 2

# ---- Sanity training settings -----------------------------------
sanity:
  subset_size: 2000             # max samples for sanity run
  epochs: 2
  batch_size: 64
  lr: 0.001

# ---- Evaluation settings ----------------------------------------
evaluation:
  batch_size: 256
  warmup_batches: 5             # batches to run before timing starts

# ---- Output settings --------------------------------------------
output:
  save_training_curves: true
  save_confusion_matrix: true
  save_per_class_metrics: true
  save_predictions: true
