# ============================================================
# configs/fft75_s1_512_bytercnn.yaml
# Frozen canonical configuration for the ByteRCNN baseline
# on FFT-75 Scenario #1 (512-byte fragments, 75 classes).
#
# DO NOT change benchmark settings (marked FROZEN).
# Training hyperparameters may be tuned, but the fragment_size,
# num_classes, and architecture must remain fixed.
# ============================================================

# ---- Benchmark identity (FROZEN) --------------------------------
benchmark:
  name: "FFT-75 Scenario #1"
  dataset: "FFT-75"
  scenario: 1                   # FROZEN — all 75 file types
  fragment_length: 512          # FROZEN — 512 bytes per fragment
  num_classes: 75               # FROZEN
  seed: 42                      # FROZEN — never change

# ---- Google Drive source ----------------------------------------
# The FFT-75.zip file lives in your Google Drive.
# Get the file ID from the share URL:
#   https://drive.google.com/file/d/<FILE_ID>/view
drive:
  file_id: "YOUR_GDRIVE_FILE_ID"   # <-- replace with your actual file ID
  archive_name: "FFT-75.zip"       # filename to save the downloaded zip as

# ---- Dataset (NPZ-based, no CSV generation) ---------------------
# Switching fragment_size: 512 → 4096 automatically selects
# FFT-75/4096/train.npz etc. No code changes needed.
dataset:
  root_dir: "data/FFT-75"          # path to extracted FFT-75/ folder
  fragment_size: 512               # 512 or 4096 — change here only
  train_file: "train.npz"
  val_file:   "val.npz"
  test_file:  "test.npz"
  cache: true                      # load full split into RAM (recommended)

# ---- Local paths ------------------------------------------------
paths:
  data_root:          "data"
  fft75_dir:          "data/FFT-75"
  best_checkpoint:    "checkpoints/best_bytercnn_fft75.pt"
  sanity_checkpoint:  "checkpoints/sanity_bytercnn_fft75.pt"
  run_outputs:        "outputs/bytercnn_fft75"
  logs_dir:           "logs"

# Kaggle-specific path overrides (used when KAGGLE_RUNTIME=1)
kaggle_paths:
  data_root:          "/kaggle/working/data"
  fft75_dir:          "/kaggle/working/data/FFT-75"
  best_checkpoint:    "/kaggle/working/checkpoints/best_bytercnn_fft75.pt"
  sanity_checkpoint:  "/kaggle/working/checkpoints/sanity_bytercnn_fft75.pt"
  run_outputs:        "/kaggle/working/outputs/bytercnn_fft75"
  logs_dir:           "/kaggle/working/logs"

# ---- Model hyperparameters (FROZEN for benchmark) ---------------
model:
  name: "ByteRCNN"
  # Architecture — FROZEN per published paper
  embedding_dim: 16             # FROZEN
  gru_units: 64                 # FROZEN
  gru_layers: 2                 # FROZEN — stacked bidirectional
  kernel_sizes: [9, 27, 40, 65] # FROZEN — 4 parallel CNN branches
  cnn_filters: 64               # FROZEN — filters per branch
  dense_units: [1024, 512]      # FROZEN — two dense layers
  dropout: 0.5

# ---- Training hyperparameters -----------------------------------
training:
  seed: 42
  epochs: 30
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  patience: 5                   # early stopping on val_acc
  grad_clip: 1.0
  optimizer: "adamw"
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 2

# ---- Sanity training settings -----------------------------------
sanity:
  subset_size: 2000
  epochs: 2
  batch_size: 64
  lr: 0.001

# ---- Evaluation settings ----------------------------------------
evaluation:
  batch_size: 256
  warmup_batches: 5
