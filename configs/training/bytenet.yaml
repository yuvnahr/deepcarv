# configs/training/bytenet.yaml
# ------------------------------
# Training hyperparameters for ByteNet — faithful to §IV-B of the paper.
#
# Optimizer: AdamW, betas=(0.9, 0.999), weight_decay=0.01
# Scheduler: Linear warmup (5e-7 → 5e-4, 2 epochs) + cosine decay to 0 (48 epochs)
# Total epochs: 50
# Batch size: 512 (FFT-75)
#
# NOTE: The warmup+cosine schedule is NOT supported by the generic
# TrainerConfig.scheduler field ('reduce_on_plateau' | 'cosine').
# The ByteNet standalone train script (scripts/train.py) implements this
# schedule directly using torch.optim.lr_scheduler.SequentialLR.
# The fields below are used only by the standalone train script.

seed: 42
epochs: 50
batch_size: 512
lr: 5.0e-4                   # peak learning rate (after warmup)
lr_warmup_start: 5.0e-7      # warmup start LR
warmup_epochs: 2             # linear warmup duration
weight_decay: 0.01
optimizer: adamw
betas: [0.9, 0.999]
grad_clip: 1.0
patience: 10                  # early stopping patience (generous for 50-epoch run)
monitor: val_acc
monitor_mode: max
amp: true
device: auto

# Image augmentation probabilities (paper §IV-B)
p_normalize: 1.0
p_hflip: 0.5
p_random_erase: 0.5
p_cutmix: 1.0
p_mixup: 0.8
mixup_alpha: 0.8
cutmix_alpha: 1.0
