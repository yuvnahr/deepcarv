# configs/training/default.yaml
# Generic training hyperparameters used by src/training/trainer.py.
# Model-agnostic — nothing here is specific to ByteRCNN.
seed: 42
epochs: 30
batch_size: 256
lr: 0.001
weight_decay: 0.0001
optimizer: adamw          # adamw | adam | sgd
scheduler: reduce_on_plateau   # reduce_on_plateau | cosine | null
scheduler_factor: 0.5
scheduler_patience: 2
grad_clip: 1.0
patience: 5                # early stopping patience
monitor: val_acc
monitor_mode: max
amp: true                  # mixed precision, only used if CUDA is available
device: auto                # auto | cuda | cpu
num_workers: 0
